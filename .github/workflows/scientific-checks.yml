name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded model-free checks from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          export CHECK_OUTPUT="$RUNNER_TEMP/editmark-scientific-checks"
          mkdir -p "$CHECK_OUTPUT"
          ulimit -t 240
          ulimit -v 1048576
          ulimit -f 131072
          ulimit -n 256
          timeout --signal=TERM --kill-after=10s 240s bash -euo pipefail <<'CHECKS' 2>&1 | tee "$CHECK_OUTPUT/raw.log"
          python -B -m unittest discover -s tests/contract -v
          python -B -m unittest discover -s regressions -v
          python -B scripts/audit_frozen_evidence.py --out "$CHECK_OUTPUT/audit"
          python -B scripts/verify_release_integrity.py
          CHECKS
      - name: Upload raw output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editmark-scientific-output
          path: ${{ runner.temp }}/editmark-scientific-checks
          if-no-files-found: warn
